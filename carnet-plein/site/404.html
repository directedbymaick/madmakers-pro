<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 - Page introuvable · Carnet Plein® by Mad Makers</title>
<meta name="description" content="Cette page n'existe pas. Retour à l'accueil de Carnet Plein® by Mad Makers." />
<meta name="robots" content="noindex,follow" />
<meta name="theme-color" content="#0a0a0a" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
<link rel="stylesheet" href="https://fonts.bunny.net/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="styles.css">
<style>
  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 32px;text-align:center;
    background:var(--encre);color:var(--paper);
    position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 50% 30%, rgba(224,84,27,0.22), transparent 60%),
      radial-gradient(ellipse 60% 80% at 90% 50%, rgba(224,84,27,0.12), transparent 65%),
      radial-gradient(ellipse 70% 70% at 10% 70%, rgba(224,84,27,0.10), transparent 65%);
  }
  body::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size:28px 28px;
    mask-image:radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 75%);
    opacity:.5;
  }
  .err-wrap{position:relative;z-index:1;max-width:680px}
  .err-eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-family:var(--f-mono);font-size:11px;letter-spacing:0.10em;
    text-transform:uppercase;color:var(--accent);font-weight:600;
    margin-bottom:30px;
  }
  .err-eyebrow .sq{width:8px;height:8px;background:var(--accent);border-radius:1px}
  .err-code{
    font-family:var(--f-display);font-weight:600;
    font-size:clamp(120px, 22vw, 220px);line-height:0.85;letter-spacing:-0.05em;
    color:var(--accent);
    margin-bottom:18px;
  }
  .err-title{
    font-family:var(--f-display);font-weight:600;
    font-size:clamp(28px, 4.5vw, 48px);line-height:1.1;letter-spacing:-0.025em;
    color:#fff;
    margin:0 0 18px;
  }
  .err-title em{font-style:italic;color:var(--accent)}
  .err-sub{
    color:#d6d3cb;font-size:16px;line-height:1.55;
    max-width:520px;margin:0 auto 36px;
  }
  .err-actions{display:inline-flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
  .err-actions .link{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--f-mono);font-size:13px;letter-spacing:0.10em;text-transform:uppercase;
    color:#fff;border-bottom:1px solid rgba(255,255,255,0.20);padding-bottom:4px;
    text-decoration:none;
    transition:color .2s ease, border-color .2s ease;
  }
  .err-actions .link:hover{color:var(--accent);border-color:var(--accent)}
  .err-actions .link .turn{color:var(--accent)}
</style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-eyebrow"><span class="sq"></span> ERREUR 404</div>
    <div class="err-code">404</div>
    <h1 class="err-title">Cette page n'existe pas. <em>On l'a peut-être déplacée.</em></h1>
    <p class="err-sub">Désolé pour le détour. Vous pouvez revenir à l'accueil ou nous écrire si vous cherchiez quelque chose de précis.</p>
    <div class="err-actions">
      <a class="link" href="/">↳ Retour à l'accueil <span class="turn">↗</span></a>
      <a class="link" href="mailto:contact@mad-makers.fr">↳ Nous écrire <span class="turn">↗</span></a>
    </div>
  </div>
</body>
</html>
